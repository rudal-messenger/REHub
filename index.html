<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REHub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{
    margin:0;
    background:#101010;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    background:#181818;
    padding:20px;
    text-align:center;
    border-bottom:2px solid #ff5e00;
}

h1{
    margin:0;
    color:#ff5e00;
    font-size:48px;
}

.tagline{
    color:#cfcfcf;
    margin-top:10px;
    font-size:18px;
}

.container{
    max-width:500px;
    margin:50px auto;
    background:#1b1b1b;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 25px rgba(0,0,0,0.5);
}

input{
    width:100%;
    padding:14px;
    margin-top:12px;
    background:#2b2b2b;
    border:none;
    color:white;
    border-radius:8px;
    box-sizing:border-box;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:16px;
    border:none;
    border-radius:8px;
    background:#ff5e00;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    background:#ff7b2e;
}

.leaderboard{
    margin-top:40px;
}

.entry{
    display:flex;
    justify-content:space-between;
    padding:12px;
    background:#262626;
    margin-top:8px;
    border-radius:8px;
}

.footer{
    text-align:center;
    color:#666;
    margin-top:50px;
    padding-bottom:30px;
}
</style>
</head>

<body>

<header>
    <h1>REHub</h1>
    <div class="tagline">
        experience bandits like (never) before
    </div>
</header>

<div class="container">

    <h2>Login</h2>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="register()">Register</button>

    <div class="leaderboard">
        <h2>Global Leaderboard</h2>

        <div id="leaderboard"></div>
    </div>

</div>

<div class="footer">
    RE:Bandits Community Revival
</div>

<script>

const SUPABASE_URL = "https://fdqggelccxbrbtytpoqu.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkcWdnZWxjY3hicmJ0eXRwb3F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MjYyNjYsImV4cCI6MjA5NTIwMjI2Nn0.XW5wzu0hIXEA0YL2HDX-eBdeG_8WiVpX8IBBLMJtgRY";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function register(){

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if(username.length < 4){
        alert("Username must be at least 4 characters long");
        return;
    }

    if(password.length < 8){
    alert("Password must be at least 8 characters long");
    return;
}

    const { data: existingUsers } = await supabaseClient
        .from("rehub_users")
        .select("*")
        .eq("username", username);

    if(existingUsers.length > 0){
        alert("Username already exists");
        return;
    }

    const { error } = await supabaseClient
        .from("rehub_users")
        .insert([
            {
                username: username,
                password: password
            }
        ]);

    if(error){
        alert(error.message);
        return;
    }

    alert("Registered successfully!");
}

async function login(){

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const { data, error } = await supabaseClient
        .from("rehub_users")
        .select("*")
        .eq("username", username)
        .eq("password", password);

    if(error || data.length === 0){
        alert("Invalid login");
        return;
    }

    localStorage.setItem(
        "rehub_user",
        JSON.stringify(data[0])
    );

   const user = data[0];

localStorage.setItem(
    "rehub_user",
    JSON.stringify(user)
);

window.location.href =
"rebandits://login?username=" +
encodeURIComponent(user.username) +
"&id=" +
encodeURIComponent(user.id);
}

async function loadLeaderboard(){

    const { data, error } = await supabaseClient
        .from("leaderboard_facebook")
        .select("*")
        .order("score", { ascending:false })
        .limit(10);

    if(error){
        console.log(error);
        return;
    }

    const leaderboard = document.getElementById("leaderboard");

    leaderboard.innerHTML = "";

    data.forEach((entry,index)=>{

        leaderboard.innerHTML += `
            <div class="entry">
                <div>#${index+1} ${entry.player_name}</div>
                <div>${entry.score}</div>
            </div>
        `;
    });
}

loadLeaderboard();

</script>

</body>
</html>
